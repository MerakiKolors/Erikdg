<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso · Manual de marca Erik David</title>
<link rel="icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --negro:#000; --dorado:#C89733; --crema:#F7F4EE; --linea:#DCD5C8; --gris:#6E6A63; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); background:var(--crema); color:#141414; font:300 17px/1.6 'Jost','Futura',sans-serif; -webkit-font-smoothing:antialiased; }
  .art { background:#000 url('/manual-de-marca/acceso-fondo.jpg') center/cover no-repeat; position:relative; display:flex; align-items:flex-end; padding:48px; color:#fff; }
  .art::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.7)); }
  .art p { position:relative; margin:0; max-width:22ch; font-size:clamp(22px,2.4vw,32px); line-height:1.25; font-weight:400; }
  .art p span { color:var(--dorado); }
  .panel { display:flex; flex-direction:column; justify-content:center; padding:48px clamp(24px,6vw,96px); }
  .wordmark { font-weight:300; font-size:30px; letter-spacing:.02em; line-height:1; }
  .wordmark b { font-weight:700; }
  .wordmark b i { font-style:normal; color:var(--dorado); }
  .wordmark small { display:block; font-size:13px; letter-spacing:.06em; margin-top:6px; font-weight:400; }
  .kicker { margin:44px 0 10px; font:400 11px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); }
  h1 { margin:0 0 12px; font-weight:400; font-size:clamp(30px,3vw,40px); line-height:1.1; letter-spacing:-.01em; }
  .intro { margin:0 0 30px; color:#3a3833; max-width:38ch; }
  form { display:grid; gap:12px; max-width:380px; }
  label { font:400 11px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); }
  input { width:100%; padding:14px 16px; border:1px solid var(--linea); border-radius:6px; background:#fff; font:400 17px 'Jost',sans-serif; color:#141414; }
  input:focus { outline:2px solid var(--dorado); outline-offset:1px; border-color:transparent; }
  button { margin-top:6px; padding:14px 18px; border:0; border-radius:6px; background:var(--negro); color:#fff; font:400 12px 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  button:hover { background:#2a2a2a; }
  .error { display:none; margin:0; padding:10px 14px; border-left:2px solid #B3261E; background:#fff; color:#7a1a14; font-size:15px; }
  .error.is-on { display:block; }
  .help { margin-top:28px; font-size:14px; color:var(--gris); max-width:38ch; }
  .help a { color:inherit; }
  @media (max-width: 820px) {
    body { grid-template-columns:1fr; }
    .art { min-height:34vh; padding:24px 16px; }
    .panel { padding:32px 16px 48px; }
    .kicker { margin-top:28px; }
  }
</style>
</head>
<body>
  <div class="art" role="img" aria-label="Retrato de Erik David">
    <p>El dorado no grita, <span>susurra valor.</span></p>
  </div>
  <main class="panel">
    <div class="wordmark" aria-label="Erik David, Property Advisor">ERIK <b><i>D</i>AVID</b><small>PROPERTY ADVISOR</small></div>
    <p class="kicker">Manual de identidad visual</p>
    <h1>Acceso privado</h1>
    <p class="intro">Este manual es de uso interno para el equipo de Erik David y sus aliados. Escribe la clave que te compartieron.</p>
    <form method="post" action="/api/manual-acceso">
      <p class="error" id="error" role="alert"></p>
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
      <input type="hidden" name="next" id="next" value="/manual-de-marca/">
      <button type="submit">Entrar al manual</button>
    </form>
    <p class="help">¿No tienes la clave? Pídela a <a href="/#contacto">Erik David</a>.</p>
  </main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var next = q.get('next');
    if (next && next.indexOf('/manual-de-marca/') === 0) document.getElementById('next').value = next;
    var err = q.get('error');
    var box = document.getElementById('error');
    if (err === '1') { box.textContent = 'La clave no es correcta. Inténtalo de nuevo.'; box.classList.add('is-on'); }
    if (err === 'config') { box.textContent = 'El acceso todavía no está configurado. Avisa a Erik David.'; box.classList.add('is-on'); }
  })();
</script>
</body>
</html>
